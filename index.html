    showToast('解析失败：无匹配内容');
  }
}

// 归一化日期为 YYYY-MM-DD
function normalizeDate(s) {
  if (!s) return '';
  s = String(s).trim();
  // 带时间戳的日期：YYYY-MM-DD HH:MM:SS / YYYY/MM/DD HH:MM / YYYY-MM-DDTHH:MM
  s = s.replace(/[T\s].*$/, '');
  // 已经是 YYYY-MM-DD
  if (/^\d{4}-\d{1,2}-\d{1,2}$/.test(s)) {
    const [y, m, d] = s.split('-');
    return `${y}-${String(parseInt(m)).padStart(2,'0')}-${String(parseInt(d)).padStart(2,'0')}`;
  }
  // YYYY/MM/DD 或 YYYY.MM.DD
  let m = s.match(/(\d{4})[\/.年](\d{1,2})[\/.月](\d{1,2})日?/);
  if (m) return `${m[1]}-${String(parseInt(m[2])).padStart(2,'0')}-${String(parseInt(m[3])).padStart(2,'0')}`;
  // MM/DD/YYYY
  m = s.match(/(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})/);
  if (m) return `${m[3]}-${String(parseInt(m[1])).padStart(2,'0')}-${String(parseInt(m[2])).padStart(2,'0')}`;
  return '';
}

function parseIntNum(v) {
  if (v === undefined || v === null) return 0;
  return parseInt(String(v).replace(/[^\d]/g, '')) || 0;
}

// 完播率解析：支持 35.6%、0.356、35.6 等
function parseCompletion(v) {
  if (v === undefined || v === null || v === '') return null;
  const s = String(v).trim();
  if (!s) return null;
  if (s.includes('%')) {
    return Math.round(parseFloat(s.replace('%', '')) * 10) / 10;
  }
  const num = parseFloat(s);
  if (isNaN(num)) return null;
  // 0-1 之间视为小数（0.356 → 35.6%），否则视为百分比
  if (num > 0 && num <= 1) return Math.round(num * 1000) / 10;
  return Math.round(num * 10) / 10;
}

// 人均观看时长解析：支持 "12"、"7.03秒"、"9.2s" 等
function parseAvgWatch(v) {
  if (v === undefined || v === null || v === '') return null;
  const s = String(v).trim();
  if (!s) return null;
  const num = parseFloat(s.replace(/[^0-9.]/g, ''));
  if (isNaN(num)) return null;
  return Math.round(num * 10) / 10;
}

function isYesValue(v) {
  if (v === undefined || v === null) return false;
  const s = String(v).trim().toLowerCase();
  if (!s) return false;
  return ['是', '1', 'true', 'y', 'yes', '√', '✓', '✔', '有', '已'].includes(s);
}

function getFilteredContents() {
  const today = getToday();
  let filtered = [...contents];

  // Apply search
  if (searchKeyword) {
    const kw = searchKeyword.toLowerCase();
    filtered = filtered.filter(c =>
      (c.title || '').toLowerCase().includes(kw) ||
      (c.topic || '').toLowerCase().includes(kw) ||
      (c.platform || '').toLowerCase().includes(kw) ||
      (c.url || '').toLowerCase().includes(kw)
    );
  }

  // Apply filter type
  if (contentFilterType === 'today') filtered = filtered.filter(c => c.createdAt === today);
  else if (contentFilterType === 'video') filtered = filtered.filter(c => isVideo(c.platform));
  else if (contentFilterType === 'article') filtered = filtered.filter(c => isArticle(c.platform));

  filtered.sort((a,b) => (b.createdAt||'').localeCompare(a.createdAt||''));
  return filtered;
}

function handleSearch(value) {
  searchKeyword = value.trim();
  clearTimeout(window._searchTimer);
  window._searchTimer = setTimeout(() => render(), 200);
}

function clearSearch() {
  searchKeyword = '';
  const input = document.getElementById('searchInput');
  if (input) input.value = '';
  render();
}

function highlightText(text, keyword) {
  if (!keyword) return text;
  const escaped = keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const regex = new RegExp(`(${escaped})`, 'gi');
  return text.replace(regex, '<span class="search-highlight">$1</span>');
}

function renderContentItem(c) {
  const type = isVideo(c.platform) ? 'video' : 'article';
  const kw = searchKeyword;
  const titleHtml = highlightText(c.title, kw);
  const topicHtml = c.topic ? highlightText(c.topic, kw) : '';
  const platformHtml = highlightText(c.platform, kw);

  // 已登记的数据（右侧数据栏，按平台动态显示）
  let dataHtml = '';
  let hasData = false;
  if (type === 'video') {
    const s = stats.find(x => x.contentId == c.id || x.contentId == Number(c.id) || (x.platform === c.platform && x.date === c.createdAt));
    if (s) {
      hasData = true;
      const completion = s.completionRate !== null && s.completionRate !== undefined ? s.completionRate + '%' : '-';
      const avgWatch = s.avgWatch !== null && s.avgWatch !== undefined ? s.avgWatch + 's' : '-';
      // 第二行：小红书=人均观看时长，其他=完播率
      const secondLine = c.platform === '小红书'
        ? `<div class="content-data-item"><span>人均观看</span><b>${avgWatch}</b></div>`
        : `<div class="content-data-item"><span>完播</span><b>${completion}</b></div>`;
      // 第三行（收藏位）：视频号=推荐，其他=收藏
      const favLine = c.platform === '视频号'
        ? `<div class="content-data-item"><span>推荐</span><b>${formatNum(s.recommend)}</b></div>`
        : `<div class="content-data-item"><span>收藏</span><b>${formatNum(s.favorites)}</b></div>`;
      dataHtml = `<div class="content-data-item"><span>播放</span><b>${formatNum(s.views)}</b></div>
        ${secondLine}
        <div class="content-data-item"><span>点赞</span><b>${formatNum(s.likes)}</b></div>
        <div class="content-data-item"><span>评论</span><b>${formatNum(s.comments)}</b></div>
        ${favLine}
        <div class="content-data-item"><span>分享</span><b>${formatNum(s.shares)}</b></div>
        <div class="content-data-item"><span>涨粉</span><b>${formatNum(s.followers)}</b></div>`;
    }
  } else {
    const s = aiStats.find(x => x.contentId == c.id || x.contentId == Number(c.id) || (x.platform === c.platform && x.date === c.createdAt));
    if (s) {
      hasData = true;
      const yes = AI_ENGINES.filter(e => s.ai && s.ai[e]);
      dataHtml = AI_ENGINES.map(ai => {
        const ok = yes.includes(ai);
        return `<div class="content-data-item"><span>${ai}</span><b style="color:${ok ? 'var(--green)' : 'var(--text3)'};">${ok ? '✓' : '—'}</b></div>`;
      }).join('');
    }
  }

  // 左侧信息栏
  let leftHtml = `<div class="content-header">
      <span class="content-title">${titleHtml}</span>
      <span class="platform-tag ${type}">${platformHtml}</span>
    </div>`;
  if (c.topic) {
    leftHtml += `<div class="content-preview"><span style="color:var(--text2);">选题：</span>${topicHtml}</div>`;
  }
  if (c.url) {
    const urlHtml = highlightText(c.url, kw);
    leftHtml += `<div class="content-url"><span style="color:var(--text2);">链接：</span><a href="${c.url}" target="_blank">${c.url.length > 50 ? urlHtml.slice(0,50)+'...' : urlHtml}</a></div>`;
  }
  leftHtml += `<div class="content-meta">${c.createdAt || ''}</div>`;
  leftHtml += `<div class="content-actions">
    <button class="btn-edit" onclick="editContent('${c.id}')">编辑</button>
    <button class="btn-delete" onclick="deleteContent('${c.id}')">删除</button>
  </div>`;

  // 右侧数据栏（数据展示 + 右下角数据录入按钮）
  const rightHtml = `<div class="content-data-side ${hasData ? 'has-data' : ''}">
    <div class="content-data-grid">
      ${hasData ? dataHtml : '<div class="content-data-empty">暂无数据</div>'}
    </div>
    <div class="content-data-btn-wrap">
      <button class="btn-publish" onclick="openDataModal('${c.id}')">数据录入</button>
    </div>
  </div>`;

  return `<div class="content-item ${type}">
    <div class="content-main">${leftHtml}</div>
    ${rightHtml}
  </div>`;
}

// ===== 单条数据录入弹窗（挂在登记内容上）=====
function openDataModal(contentId) {
  const c = contents.find(x => x.id == contentId || x.id == Number(contentId));
  if (!c) return;
  const type = isVideo(c.platform) ? 'video' : 'article';
  pendingDataContentId = c.id;
  document.getElementById('modalContent').innerHTML = type === 'video'
    ? renderVideoDataModal(c)
    : renderAiDataModal(c);
  document.getElementById('modalOverlay').classList.add('active');
}

function renderVideoDataModal(c) {
  const s = stats.find(x => x.contentId == c.id || x.contentId == Number(c.id) || (x.platform === c.platform && x.date === c.createdAt));

let pendingDataContentId = null;

// 清空当前弹窗的数据录入内容（不保存）
function clearContentData() {
  const c = contents.find(x => x.id == pendingDataContentId || x.id == Number(pendingDataContentId));
  if (!c) return;
  const type = isVideo(c.platform) ? 'video' : 'article';
  if (type === 'video') {
    ['statTitle', 'statViews', 'statCompletion', 'statAvgWatch', 'statLikes', 'statComments', 'statFavorites', 'statRecommend', 'statShares', 'statFollowers'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.value = '';
    });
  } else {
    document.querySelectorAll('#aiChecks .ai-check-item').forEach(el => {
      el.classList.remove('checked');
      el.querySelector('.check-box').innerHTML = '';
    });
  }
  showToast('已清空，点击保存后生效');
}

function saveContentData() {
  const c = contents.find(x => x.id == pendingDataContentId || x.id == Number(pendingDataContentId));
  if (!c) { showToast('内容不存在'); return; }
  const type = isVideo(c.platform) ? 'video' : 'article';
  if (type === 'video') {
    const title = (document.getElementById('statTitle').value || '').trim() || c.title;
    const views = parseInt(document.getElementById('statViews').value) || 0;
    const completionInput = document.getElementById('statCompletion').value;
    const completionRate = completionInput !== '' ? parseFloat(completionInput) : null;
    const avgWatchInput = document.getElementById('statAvgWatch').value;
    const avgWatch = avgWatchInput !== '' ? parseFloat(avgWatchInput) : null;
    const recommend = parseInt(document.getElementById('statRecommend').value) || 0;
    const likes = parseInt(document.getElementById('statLikes').value) || 0;
    const comments = parseInt(document.getElementById('statComments').value) || 0;
    const favorites = parseInt(document.getElementById('statFavorites').value) || 0;
    const shares = parseInt(document.getElementById('statShares').value) || 0;
    const followers = parseInt(document.getElementById('statFollowers').value) || 0;
    const existing = stats.find(x => x.contentId == c.id || x.contentId == Number(c.id) || (x.platform === c.platform && x.date === c.createdAt));
    const statData = { platform: c.platform, date: c.createdAt, title, views, completionRate, avgWatch, recommend, likes, comments, favorites, shares, followers, contentId: c.id };
    if (existing) Object.assign(existing, statData);
    else stats.push({ id: Date.now() + Math.random(), ...statData });
    saveData('stats', stats);
    markTaskRecorded(c.platform, c.createdAt);
  } else {
    const ai = {};
    document.querySelectorAll('#aiChecks .ai-check-item').forEach(el => {
      ai[el.dataset.ai] = el.classList.contains('checked');
    });
    const existing = aiStats.find(x => x.contentId == c.id || x.contentId == Number(c.id) || (x.platform === c.platform && x.date === c.createdAt));
    if (existing) { existing.ai = ai; existing.contentId = c.id; }
    else aiStats.push({ id: Date.now() + Math.random(), platform: c.platform, date: c.createdAt, title: c.title, ai, contentId: c.id });
    saveData('aiStats', aiStats);
    markTaskRecorded(c.platform, c.createdAt);
  }
  pendingDataContentId = null;
  closeModal(); render();
  showToast('数据已保存');
}

function filterContent(filter, el) {
  contentFilterType = filter === 'all' ? '' : filter;
  render();
}

function deleteContent(id) {
  showConfirm({
    title: '确认删除',
    desc: '确定删除这条记录吗？删除后不可恢复。<br><br><span style="color:var(--text3);">关联的发布任务将回到「未登记」状态，可重新登记。</span>',
    danger: true,
    onOk: () => {
      const numId = Number(id);
      contents = contents.filter(c => c.id != id && c.id != numId);
      // 解除任务关联：linked 重置，contentId 清空（任务保留完成状态，重新显示「登记链接」）
      let taskChanged = false;
      tasks.forEach(t => {
        if (t.contentId !== null && t.contentId !== undefined && (t.contentId == id || t.contentId == numId)) {
          t.contentId = null;
          t.linked = false;
          taskChanged = true;
        }
      });
      if (taskChanged) saveData('tasks', tasks);
      // 同步清理关联的视频数据 / AI收录数据
      stats = stats.filter(s => !(s.contentId == id || s.contentId == numId));
      aiStats = aiStats.filter(s => !(s.contentId == id || s.contentId == numId));
      saveData('stats', stats); saveData('aiStats', aiStats);
      saveData('contents', contents); render(); showToast('已删除，任务已回到未登记状态');
    }
  });
}

  } else {
    html += `<div class="form-group"><label>AI收录筛查情况</label><textarea id="reviewAi" placeholder="DeepSeek/豆包/千问/文心/元宝/纳米 收录情况小结…"></textarea></div>`;
  }
  html += `<div class="form-group"><label>下期计划</label><textarea id="reviewPlans" placeholder="下周/月计划做什么…"></textarea></div>`;
  html += `<div class="toolbar" style="margin-top:8px;">

  // 历史复盘列表（只显示当前类型的记录）
  const sortedReviews = [...reviews]

  html += `<div class="review-history-box">
    <div class="review-history-title">📋 ${isVideo ? '短视频' : '文书'}复盘记录 <span class="badge">${sortedReviews.length}条</span></div>
    <div class="review-history-list">`;
  if (sortedReviews.length === 0) {
    html += '<p style="font-size:12px;color:var(--text3);padding:8px 0;">暂无复盘记录</p>';
  } else {
    sortedReviews.forEach(r => {
      const typeTag = isVideo ? 'video' : 'article';
      const typeLabel = isVideo ? '短视频' : '文书';
      html += `<div class="review-item">
        <div class="review-item-head">
          <span class="platform-tag ${typeTag}">${typeLabel}·${formatReviewRange(r.period, r.date)}</span>
          <span style="font-size:11px;color:var(--text3);">${r.date}</span>
        </div>
        ${r.highlights ? `<div class="review-item-line"><span style="color:var(--green);">亮点：</span>${r.highlights}</div>` : ''}
        ${r.metrics ? `<div class="review-item-line"><span style="color:var(--teal);">数据：</span>${r.metrics}</div>` : ''}

        ${r.problems ? `<div class="review-item-line"><span style="color:var(--red);">问题：</span>${r.problems}</div>` : ''}

function saveReview() {
  const type = dataSubTab; // 跟随上方子Tab
  const period = document.getElementById('reviewPeriod').value;
  const date = document.getElementById('reviewDate').value || getToday();
  const highlights = document.getElementById('reviewHighlights').value.trim();
  const problems = document.getElementById('reviewProblems').value.trim();
  const aiEl = document.getElementById('reviewAi');
  const ai = aiEl ? aiEl.value.trim() : '';
  const metricsEl = document.getElementById('reviewMetrics');
  const metrics = metricsEl ? metricsEl.value.trim() : '';
  const plans = document.getElementById('reviewPlans').value.trim();
  if (!highlights && !problems && !ai && !metrics && !plans) { showToast('请至少填写一项内容'); return; }
  // 同日同周期同类型覆盖
  const existing = reviews.find(r => r.date === date && r.period === period && r.type === type);
  if (existing) { existing.highlights = highlights; existing.problems = problems; existing.ai = ai; existing.metrics = metrics; existing.plans = plans; }
  else reviews.push({ id: Date.now(), type, period, date, highlights, problems, ai, metrics, plans });
  saveData('reviews', reviews); render(); showToast('复盘已保存');
}

function deleteReview(id) {
  showConfirm({
    title: '确认删除',
    desc: '确定删除这条复盘记录吗？',
    danger: true,
    onOk: () => {
      reviews = reviews.filter(r => r.id != id && r.id != Number(id));
      saveData('reviews', reviews); render(); showToast('已删除');
    }
  });
}

// 复盘时间段标签：周→所在周周一~周日，月→当月1号~月末
function formatReviewRange(period, dateStr) {
  if (!dateStr) return period === 'month' ? '本月' : '本周';
  const d = new Date(dateStr + 'T00:00:00');
  if (isNaN(d.getTime())) return period === 'month' ? '本月' : '本周';
  if (period === 'month') {
    const start = new Date(d.getFullYear(), d.getMonth(), 1);
    const end = new Date(d.getFullYear(), d.getMonth() + 1, 0);
    return '本月·' + getDayStr(start) + ' ~ ' + getDayStr(end);
  }
  // 周：所在周的周一到周日
  const diffToMon = (d.getDay() + 6) % 7;
  const start = new Date(d); start.setDate(d.getDate() - diffToMon);
  const end = new Date(start); end.setDate(start.getDate() + 6);
  return '本周·' + getDayStr(start) + ' ~ ' + getDayStr(end);
}

  else {
    html += '<div style="overflow-x:auto;"><table class="data-table"><thead><tr><th>日期</th><th>平台</th><th>标题</th><th>播放</th><th>完播/人均观看</th><th>点赞</th><th>评论</th><th>收藏/推荐</th><th>分享</th><th>涨粉</th></tr></thead><tbody>';

      const linkedTitle = findLinkedTitle(s, 'video');
      const title = s.title || linkedTitle || '未关联';

      const noLink = linkedTitle === null;

      let completionCell;
      if (s.platform === '小红书') {
        completionCell = s.avgWatch !== null && s.avgWatch !== undefined ? s.avgWatch + 's' : '-';
      } else {
        completionCell = s.completionRate !== null && s.completionRate !== undefined ? s.completionRate + '%' : '-';

// ===== UTIL =====
// 关联内容标题：优先 contentId 精确匹配，兜底 platform+date 匹配。返回 null 表示无关联。
function findLinkedTitle(record, type) {
  // 1. 按 contentId 精确匹配
  if (record.contentId) {
    const c = contents.find(c => c.id == record.contentId || c.id == Number(record.contentId));
    if (c) return c.title;
  }
  // 2. 按 platform + date 匹配（兼容无 contentId 的旧数据）
  const sameDay = contents.find(c => c.platform === record.platform && c.createdAt === record.date);
  if (sameDay) return sameDay.title;
  return null;
}

function formatNum(n) {
  if (n >= 10000) return (n/10000).toFixed(1) + 'w';
  if (n >= 1000) return (n/1000).toFixed(1) + 'k';
  return n || 0;
}

function exportData() {
  const data = { version: 3, exportedAt: new Date().toISOString(), tasks, contents, stats, aiStats, reviews };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `新媒体工作台_${getToday()}.json`; a.click();
  URL.revokeObjectURL(url); showToast('已导出');
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (data.tasks) { tasks = data.tasks; saveData('tasks', tasks); }
      if (data.contents) { contents = data.contents; saveData('contents', contents); }
      if (data.stats) { stats = data.stats; saveData('stats', stats); }
      if (data.aiStats) { aiStats = data.aiStats; saveData('aiStats', aiStats); }
      if (data.reviews) { reviews = data.reviews; saveData('reviews', reviews); }
      render(); showToast('导入成功');
    } catch(err) { showToast('导入失败：文件格式错误'); }
  };
  reader.readAsText(file); event.target.value = '';
}

function checkBackupReminder() {
  const total = tasks.length + contents.length + stats.length + aiStats.length;
  if (total >= 30 && !localStorage.getItem(STORAGE_KEY + 'backup_reminded')) {
    localStorage.setItem(STORAGE_KEY + 'backup_reminded', '1');
    showToast('数据已积累30条，建议导出备份');
  }
}

// ===== 每周数据登记复盘 + AI收录筛查提醒 =====
function checkWeeklyReminder() {
  const KEY = STORAGE_KEY + 'weekly_remind';
  const last = localStorage.getItem(KEY);
  const today = getToday();
  // 首次使用：记录今天，不打扰
  if (!last) {
    localStorage.setItem(KEY, today);
    return;
  }
  // 距离上次提醒 >= 7 天则提醒
  const lastDate = new Date(last);
  const diffDays = Math.floor((new Date(today + 'T00:00:00') - lastDate) / 86400000);
  if (diffDays >= 7) {
    // 检查本周是否有已发布但未登记链接的任务
    const weekAgo = new Date(Date.now() - 6 * 86400000);
    const weekAgoStr = getDayStr(weekAgo);
    const pendingTasks = tasks.filter(t =>
      t.date >= weekAgoStr && t.date <= today && t.done && !t.linked
    );
    const pendingCount = pendingTasks.length;
    // 检查本周是否已有复盘记录
    const hasReview = reviews.some(r => r.date >= weekAgoStr && r.date <= today);
    let msg;
    if (pendingCount > 0) {
      msg = `📊 已到每周复盘时间，本周还有 ${pendingCount} 条内容未登记链接，建议先登记再复盘`;
    } else if (!hasReview) {
      msg = `📊 已到每周复盘时间，记得进行一次数据登记复盘 + AI收录情况筛查`;
    } else {
      msg = `📊 已到每周复盘时间，本周复盘已完成，继续保持！`;
    }
    showToast(msg);
    localStorage.setItem(KEY, today);
  }
}
