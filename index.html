<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>新媒体内容发布工作台</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/style.css?v=20260806bb">
<!-- CloudBase 环境配置（部署前创建 js/cloud-config.js；本地开发无此文件时走本地模式） -->
<script src="js/cloud-config.js?v=20260806bb"></script>
<!-- CloudBase Web SDK：ES Module 方式（jsdelivr CDN）+ 暴露为 window.cloudbase，给 cloud.js 使用 -->
<script type="module">
  import cloudbase from 'https://cdn.jsdelivr.net/npm/@cloudbase/js-sdk@3.7.1/dist/index.esm.js';
  window.cloudbase = cloudbase;
</script>
</head>
<body>

<div class="topbar">
  <div class="header">
    <h1>新媒体内容发布工作台</h1>
    <div class="subtitle">4短视频 + 5文书平台 · 内容登记 + 数据小结</div>
  </div>
  <div class="nav-tabs" id="navTabs">
    <div class="nav-tab active" data-tab="today">今日待办</div>
    <div class="nav-tab" data-tab="content">内容登记</div>
    <div class="nav-tab" data-tab="data">数据复盘</div>
    <div class="nav-tab" data-tab="calendar">发布日历</div>
    <div class="nav-tab" data-tab="overview">发布总览</div>
  </div>
</div>

<div class="backup-bar">
  <div class="backup-group">
    <button onclick="exportData()">导出JSON</button>
    <button onclick="document.getElementById('importFile').click()">导入恢复</button>
    <button onclick="clearAllData()">清空数据</button>
    <button onclick="fillSampleData()">重置示例</button>
    <input type="file" id="importFile" accept=".json" onchange="importData(event)">
  </div>
  <!-- 云同步状态条：登录/注册/未登录提示，右对齐 -->
  <div class="cloud-bar" id="cloudBar"></div>
</div>
</div>

<div class="main" id="mainContent"></div>

<button class="fab" id="fabBtn" onclick="openAddModal()">+</button>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<!-- ===== 依赖顺序加载：store(数据) → ui(通用) → views → export/sample → cloud → app(入口) ===== -->
<!-- ?v=20260806bb 版本号：改动 JS/CSS 后请同步更新，避免浏览器缓存旧文件 -->
<script src="js/store.js?v=20260806bb"></script>
<script src="js/ui.js?v=20260806bb"></script>
<script src="js/views/today.js?v=20260806bb"></script>
<script src="js/views/calendar.js?v=20260806bb"></script>
<script src="js/views/overview.js?v=20260806bb"></script>
<script src="js/views/content.js?v=20260806bb"></script>
<script src="js/views/table-parser.js?v=20260806bb"></script>
<script src="js/views/data.js?v=20260806bb"></script>
<script src="js/export.js?v=20260806bb"></script>
<script src="js/sample-migration.js?v=20260806bb"></script>
<script src="js/cloud.js?v=20260806bb"></script>
<script src="js/cloud-ui.js?v=20260806bb"></script>
<script src="js/app.js?v=20260806bb"></script>
</body>
</html>
